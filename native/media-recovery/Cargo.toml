[package]
name = "media-recovery"
version = "0.2.0"
edition = "2021"
publish = false

[dependencies]
ffmpeg-next = { version = "=8.1.0", default-features = false, features = [
    "codec",
    "format",
    "software-resampling",
    "software-scaling",
] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.149"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
